<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover opts the WebView/PWA into edge-to-edge so env(safe-area-inset-*)
			 (and the SystemBars-injected --safe-area-inset-* vars) report real values: the header
			 clears the notch and the composer clears the home indicator. interactive-widget=
			 resizes-content makes the layout viewport (and thus dvh) shrink when the soft keyboard
			 opens, so the chat composer stays visible instead of hiding behind it. Native gets the
			 same keyboard effect via windowSoftInputMode=adjustResize. maximum-scale/user-scalable
			 remove pinch + double-tap zoom: the native app is zoom-less by design (Capacitor
			 zoomableWebView defaults off), so web matches it and chat gestures stay pure. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#020617" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Cordn" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
		<script>
			/* No-flash theme restore: re-apply the active theme's compiled CSS before
			   first paint. Persisted as `cordn.themeCss` by the theming service
			   (appearance.svelte.ts); layout.css only holds the default (Soft). */
			try {
				var q = new URLSearchParams(location.search);
				var css;
				if (q.get('embed') === '1') {
					/* ADR 0021: inside Continuum, its palette and its light or dark
					   (`&mode=`), never the stored Teams theme. Same string as
					   themeCss(CONTINUUM_THEME); embedLook.test.ts keeps them equal. */
					css =
						':root:root{--background:#ffffff;--card:#faf8f5;--popover:#ffffff;--secondary:#f1eee9;--accent:#f3f1ec;--muted:#f3f1ec;--foreground:#26221d;--card-foreground:#26221d;--popover-foreground:#26221d;--secondary-foreground:#312d25;--accent-foreground:#26221d;--muted-foreground:#716b60;--primary:#e18b09;--primary-foreground:#291f0f;--destructive:#bf2222;--border:#eae5dc;--input:#e4e0d7;--ring:#e18b09;--radius:0.75rem;}:root:root.dark{--background:#221f1c;--card:#322e2a;--popover:#221f1c;--secondary:#322e2a;--accent:#34312d;--muted:#34312d;--foreground:#f0eeea;--card-foreground:#eeece7;--popover-foreground:#f0eeea;--secondary-foreground:#eeece7;--accent-foreground:#f0eeea;--muted-foreground:#a6a096;--primary:#f6ae31;--primary-foreground:#211a12;--destructive:#e36363;--border:#38332e;--input:#48433d;--ring:#f6ae31;--radius:0.75rem;}:root:root .chat-own{--primary:#fbefdd;--primary-foreground:#26221d;border-color:#f2ce98;}:root:root.dark .chat-own{--primary:#40331f;--primary-foreground:#f0eeea;border-color:#7b5b25;}';
					var m = q.get('mode');
					var dark = m ? m === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
				} else css = localStorage.getItem('cordn.themeCss');
				if (css) {
					var s = document.createElement('style');
					s.id = 'cordn-theme';
					s.textContent = css;
					document.head.appendChild(s);
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
